onboarding = false

# vesper 팔레트는 ghostty/themes/vesper 기준이다.
# 배경은 Ghostty의 투명도와 블러를 그대로 쓰도록 reset으로 둔다.
[theme]
name = "catppuccin"

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
surface_dim = "#101010"
surface0 = "#161616"
surface1 = "#1c1c1c"
active_row_bg = "#232323"
selection_bg = "#282828"
overlay0 = "#505050"
overlay1 = "#a0a0a0"
text = "#ffffff"
subtext0 = "#a0a0a0"
accent = "#ffc799"
blue = "#a0a0a0"
green = "#99ffe4"
yellow = "#ffc799"
red = "#ff8080"
mauve = "#a0a0a0"
teal = "#99ffe4"
peach = "#ff7300"

[ui]
sidebar_width = 28
sidebar_min_width = 22
sidebar_max_width = 34
pane_gaps = true
pane_borders = "always"
pane_outer_borders = true

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "workspace", "tab"], ["agent"]]

# cmux 단축키 대응. cmux의 cmd 조합은 TUI까지 전달되지 않아 alt 기반으로 바꿨다.
# pane 이동(ctrl+hjkl)은 nvim split과 이어지도록 herdr-nvim-nav 플러그인으로 처리한다.
# macos-option-as-alt = true 이므로 Ghostty에서 alt가 그대로 전달된다.
[keys]
next_tab = "alt+n"
previous_tab = "alt+p"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
