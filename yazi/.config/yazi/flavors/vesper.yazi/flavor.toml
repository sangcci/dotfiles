[manager]
marker_copied = { fg = "#99ffe4", bg = "#99ffe4" }
marker_cut = { fg = "#ff8080", bg = "#ff8080" }
marker_marked = { fg = "#a0a0a0", bg = "#a0a0a0" }
marker_selected = { fg = "#ffcfa8", bg = "#ffcfa8" }

cwd = { fg = "#ffc799" }
hovered = { reversed = true }
preview_hovered = { reversed = true }

find_keyword = { fg = "#ffcfa8", bg = "#101010" }
find_position = {}

tab_active = { reversed = true }
tab_inactive = {}
tab_width = 1

count_copied = { fg = "#101010", bg = "#99ffe4" }
count_cut = { fg = "#101010", bg = "#ff8080" }
count_selected = { fg = "#101010", bg = "#ffc799" }

border_symbol = "│"
border_style = { fg = "#ffffff" }


[mode]
normal_main = { fg = "#101010", bg = "#ffc799" }
normal_alt = { fg = "#ffc799", bg = "#101010" }
select_main = { fg = "#101010", bg = "#a0a0a0" }
select_alt = { fg = "#a0a0a0", bg = "#101010" }
unset_main = { fg = "#101010", bg = "#ffc799" }
unset_alt = { fg = "#ffc799", bg = "#101010" }


[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "#ffffff", bg = "#101010" }

progress_label = { fg = "#ffc799", bg = "#101010", bold = true }
progress_normal = { fg = "#101010", bg = "#101010" }
progress_error = { fg = "#101010", bg = "#101010" }

perm_type = { fg = "#99ffe4" }
perm_read = { fg = "#ffc799" }
perm_write = { fg = "#ff8080" }
perm_exec = { fg = "#99ffe4" }
perm_sep = { fg = "#a0a0a0" }


[pick]
border = { fg = "#ffc799" }
active = { fg = "#a0a0a0", bold = true }
inactive = {}

[input]
border = { fg = "#ffc799" }
title = {}
value = {}
selected = { reversed = true }

[completion]
border = { fg = "#ffc799" }
active = { reversed = true }
inactive = {}

[tasks]
border = { fg = "#ffc799" }
title = {}
hovered = { fg = "#a0a0a0" }

[which]
cols = 2
separator = " - "
separator_style = { fg = "#a0a0a0" }
mask = { bg = "#101010" }
rest = { fg = "#a0a0a0" }
cand = { fg = "#99ffe4" }
desc = { fg = "#ffffff" }

[help]
on = { fg = "#99ffe4" }
run = { fg = "#a0a0a0" }
desc = {}
hovered = { reversed = true, bold = true }
footer = { fg = "#101010", bg = "#ffffff" }

[notify]
title_info = { fg = "#99ffe4" }
title_warn = { fg = "#ffc799" }
title_error = { fg = "#ff8080" }

[filetype]
rules = [
    # images
    { mime = "image/*", fg = "#ffc799" },

    # media
    { mime = "{audio,video}/*", fg = "#a0a0a0" },

    # archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff8080" },

    # documents
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#a0a0a0" },

    # broken links
    { url = "*", is = "orphan", fg = "#ff8080" },

    # executables
    { url = "*", is = "exec", fg = "#99ffe4" },

    # fallback
    { url = "*", fg = "#ffffff" },
    { url = "*/", fg = "#ffc799" },
]
